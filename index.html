<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuales Corporativos</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Mammoth JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --header-blue: #0d47a1;
            --blue-primary: #1565c0;
            --blue-hover: #0d47a1;
            
            --bg-page: #f4f4f4;
            --bg-card: #ffffff;
            --bg-table-header: #e9e9e9;
            --bg-table-hover: #f9f9f9;
            
            --border-light: #dcdcdc;
            --text-dark: #333333;
            --text-muted: #666666;
            --badge-info: #9ec5d3;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 0;
        }

        .top-bar-blue {
            background-color: var(--header-blue);
            color: #ffffff;
            padding: 8px 20px;
            font-size: 12px;
        }

        .top-bar-blue .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .main-navbar {
            background-color: #ffffff;
            border-bottom: 2px solid var(--border-light);
            padding: 0 10px;
        }

        .nav-portalsn {
            border: none;
            gap: 0;
        }

        .nav-portalsn .nav-item {
            border-right: 1px solid var(--border-light);
        }

        .nav-portalsn .nav-link {
            color: var(--text-muted);
            border: none;
            border-radius: 0;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            background: transparent;
            position: relative;
            transition: color 0.2s ease-in-out;
        }

        .nav-portalsn .nav-link.active {
            color: var(--text-dark);
            background: transparent;
        }

        .nav-portalsn .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background-color: var(--blue-primary);
        }

        .nav-portalsn .nav-link:hover:not(.active) {
            color: var(--blue-primary);
        }

        .content-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 0;
            padding: 20px;
            margin-top: 15px;
        }

        .section-title {
            font-size: 13px;
            font-weight: normal;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .form-label-custom {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .input-portalsn {
            font-size: 12px;
            border-radius: 2px;
            border: 1px solid var(--border-light);
            padding: 5px 8px;
            background-color: #ffffff;
        }

        .input-portalsn:focus {
            border-color: var(--blue-primary);
            box-shadow: none;
        }

        .table-portalsn {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            border: 1px solid var(--border-light);
        }

        .table-portalsn th {
            background-color: var(--bg-table-header);
            color: var(--text-dark);
            font-weight: bold;
            padding: 7px 10px;
            border: 1px solid var(--border-light);
            text-transform: uppercase;
        }

        .table-portalsn td {
            padding: 7px 10px;
            border: 1px solid var(--border-light);
            vertical-align: middle;
            color: var(--text-dark);
        }

        .table-portalsn tbody tr:hover {
            background-color: var(--bg-table-hover);
        }

        .btn-portalsn-blue {
            background-color: var(--blue-primary);
            color: #ffffff;
            border: none;
            border-radius: 2px;
            padding: 5px 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-portalsn-blue:hover {
            background-color: var(--blue-hover);
            color: #ffffff;
        }

        .btn-portalsn-gray {
            background-color: #f0f0f0;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            border-radius: 2px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-portalsn-gray:hover {
            background-color: #e0e0e0;
        }

        .badge-count {
            background-color: var(--badge-info);
            color: #ffffff;
            font-size: 11px;
            font-weight: normal;
            padding: 4px 8px;
            border-radius: 2px;
            display: inline-block;
        }

        .badge-status-ok {
            background-color: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
            font-weight: bold;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
        }

        #modalFullContent img {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            margin: 10px auto;
        }

        #modalFullContent table {
            max-width: 100% !important;
            width: 100% !important;
            table-layout: fixed;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="top-bar-blue d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-book-open text-white me-1"></i>
            <span class="logo-text">SISTEMA DE MANUALES Y PROCEDIMIENTOS</span>
        </div>
        <div class="d-flex align-items-center gap-2" style="font-size: 11px;">
            <button class="btn btn-sm text-white p-0 border-0" onclick="initApp()">
                <i class="fa-solid fa-rotate-right me-1"></i>Actualizar
            </button>
        </div>
    </div>

    <div class="main-navbar">
        <ul class="nav nav-portalsn d-flex justify-content-start" id="mainTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="vis-prov-tab" data-bs-toggle="tab" data-bs-target="#vis-prov" type="button">
                    Vis. Manual Proveedores
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="vis-int-tab" data-bs-toggle="tab" data-bs-target="#vis-int" type="button">
                    Vis. Manual Interno
                </button>
            </li>
        </ul>
    </div>

    <div class="container-fluid px-4 py-3">
        <div class="tab-content" id="mainTabsContent">
            
            <!-- VISTA PROVEEDORES -->
            <div class="tab-pane fade show active" id="vis-prov" role="tabpanel">
                <div class="section-title">Seleccione la Orden o Razón Social que desea consultar:</div>
                <div class="content-card">
                    <div class="row align-items-end mb-3 g-2">
                        <div class="col-md-5">
                            <label class="form-label-custom">Seleccione Razón Social / Proveedor</label>
                            <input type="text" id="searchProvInput" class="form-control input-portalsn" list="provOptions" placeholder="- Escriba o seleccione -" oninput="filterManuals('PROVEEDOR')">
                            <datalist id="provOptions"></datalist>
                        </div>
                        <div class="col-md-3">
                            <span id="provCountBadge" class="badge-count"><i class="fa-solid fa-magnifying-glass me-1"></i>Cargando...</span>
                        </div>
                    </div>

                    <table class="table-portalsn">
                        <thead>
                            <tr>
                                <th>TIPO DOCUMENTO</th>
                                <th>RAZÓN SOCIAL / NOMBRE PROVEEDOR</th>
                                <th>ESTADO</th>
                                <th class="text-end">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tableProv"></tbody>
                    </table>
                </div>
            </div>

            <!-- VISTA INTERNO -->
            <div class="tab-pane fade" id="vis-int" role="tabpanel">
                <div class="section-title">Seleccione el Proceso Interno que desea consultar:</div>
                <div class="content-card">
                    <div class="row align-items-end mb-3 g-2">
                        <div class="col-md-5">
                            <label class="form-label-custom">Seleccione Proceso Interno</label>
                            <input type="text" id="searchIntInput" class="form-control input-portalsn" list="intOptions" placeholder="- Escriba o seleccione -" oninput="filterManuals('INTERNO')">
                            <datalist id="intOptions"></datalist>
                        </div>
                        <div class="col-md-3">
                            <span id="intCountBadge" class="badge-count"><i class="fa-solid fa-magnifying-glass me-1"></i>Cargando...</span>
                        </div>
                    </div>

                    <table class="table-portalsn">
                        <thead>
                            <tr>
                                <th>TIPO DOCUMENTO</th>
                                <th>NOMBRE DEL MANUAL / PROCESO</th>
                                <th>ESTADO</th>
                                <th class="text-end">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tableInt"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Visualizador -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content" style="border-radius: 0;">
                <div class="modal-header py-2" style="background-color: var(--header-blue); color: #ffffff;">
                    <h6 class="modal-title fw-bold" id="modalTitle"></h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="modalFullContent" style="font-size: 13px; line-height: 1.5;"></div>
                </div>
                <div class="modal-footer py-2" style="background-color: var(--bg-table-header);">
                    <button type="button" id="modalDownloadBtn" class="btn-portalsn-blue">
                        <i class="fa-solid fa-file-word me-1"></i>Descargar Word
                    </button>
                    <button type="button" class="btn-portalsn-gray" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Imprimir</button>
                    <button type="button" class="btn-portalsn-gray" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ARCHIVOS REGISTRADOS DIRECTAMENTE DE TU LISTA
        const PRELOADED_DOCS = [
            { fileName: "ADMINISTRACIÓN DE EMPRESAS S.A.C.docx", title: "ADMINISTRACIÓN DE EMPRESAS S.A.C", type: "PROVEEDOR" },
            { fileName: "APM TERMINALS CALLAO SOCIEDAD ANONIMA.docx", title: "APM TERMINALS CALLAO SOCIEDAD ANONIMA", type: "PROVEEDOR" },
            { fileName: "AUSTRAL GROUP S.A.docx", title: "AUSTRAL GROUP S.A", type: "PROVEEDOR" },
            { fileName: "BM2 - PORTAL REGISTRO.docx", title: "BM2 - PORTAL REGISTRO", type: "INTERNO" },
            { fileName: "COMPAÑIA MINERA ANTAMINA S.A.docx", title: "COMPAÑIA MINERA ANTAMINA S.A", type: "PROVEEDOR" },
            { fileName: "FACTURAS NO COMERCIALES.docx", title: "FACTURAS NO COMERCIALES", type: "INTERNO" },
            { fileName: "FERREYROS SOCIEDAD ANÓNIMA.docx", title: "FERREYROS SOCIEDAD ANÓNIMA", type: "PROVEEDOR" },
            { fileName: "GUIA DE BAJAS DE FACTURA.docx", title: "GUIA DE BAJAS DE FACTURA", type: "INTERNO" },
            { fileName: "HOLCIM PERÚ AGREGADOS.docx", title: "HOLCIM PERÚ AGREGADOS", type: "PROVEEDOR" },
            { fileName: "JJC CONTRATISTAS GENERALES.docx", title: "JJC CONTRATISTAS GENERALES", type: "PROVEEDOR" },
            { fileName: "JRC INGENIERIA Y CONSTRUCCION S.A.C.docx", title: "JRC INGENIERIA Y CONSTRUCCION S.A.C", type: "PROVEEDOR" }
        ];

        let manualsCache = [];

        async function initApp() {
            manualsCache = [];
            for (const doc of PRELOADED_DOCS) {
                try {
                    const fileUrl = `./${encodeURIComponent(doc.fileName)}`;
                    const response = await fetch(fileUrl);
                    if (response.ok) {
                        const arrayBuffer = await response.arrayBuffer();
                        const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                        manualsCache.push({
                            id: doc.fileName,
                            type: doc.type,
                            title: doc.title,
                            htmlContent: result.value,
                            fileUrl: fileUrl,
                            fileName: doc.fileName
                        });
                    }
                } catch (e) {
                    console.error("Error al cargar " + doc.fileName, e);
                }
            }
            renderAll();
        }

        function renderAll() {
            filterManuals('PROVEEDOR');
            filterManuals('INTERNO');
        }

        function filterManuals(type) {
            const isProv = type === 'PROVEEDOR';
            const inputVal = (document.getElementById(isProv ? 'searchProvInput' : 'searchIntInput').value || '').toLowerCase();
            const tableBody = document.getElementById(isProv ? 'tableProv' : 'tableInt');
            const dataList = document.getElementById(isProv ? 'provOptions' : 'intOptions');
            const badge = document.getElementById(isProv ? 'provCountBadge' : 'intCountBadge');

            tableBody.innerHTML = '';
            dataList.innerHTML = '';

            const filtered = manualsCache.filter(m => m.type === type && m.title.toLowerCase().includes(inputVal));

            manualsCache.filter(m => m.type === type).forEach(m => {
                dataList.innerHTML += `<option value="${m.title}">`;
            });

            filtered.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${item.type}</b></td>
                    <td>${item.title}</td>
                    <td><span class="badge-status-ok">DISPONIBLE</span></td>
                    <td class="text-end">
                        <button class="btn-portalsn-gray py-0 px-2 me-1">
                            <i class="fa-solid fa-eye me-1"></i>Ver
                        </button>
                        <a href="${item.fileUrl}" download="${item.fileName}" class="btn-portalsn-gray py-0 px-2 me-1 text-decoration-none">
                            <i class="fa-solid fa-file-word text-primary"></i>
                        </a>
                    </td>
                `;
                row.querySelector('button').onclick = () => viewFullManual(item.id);
                tableBody.appendChild(row);
            });

            badge.innerHTML = `<i class="fa-solid fa-magnifying-glass me-1"></i>Se encontraron ${filtered.length} registros`;
        }

        function viewFullManual(id) {
            const item = manualsCache.find(m => m.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.title + " (" + item.type + ")";
            document.getElementById('modalFullContent').innerHTML = item.htmlContent || '<p>Sin contenido.</p>';

            const modalDownloadBtn = document.getElementById('modalDownloadBtn');
            modalDownloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = item.fileUrl;
                a.download = item.fileName;
                a.click();
            };

            const modal = new bootstrap.Modal(document.getElementById('viewModal'));
            modal.show();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
