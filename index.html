<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Manuales Corporativos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Mammoth JS (Convertidor avanzado de DOCX a HTML con soporte de imágenes Base64) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <style>
    /* Estilos para el documento extraído del Word */
    .word-content h1 { font-size: 1.75rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #0f172a; }
    .word-content h2 { font-size: 1.35rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #1e293b; }
    .word-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #334155; }
    .word-content p { font-size: 0.95rem; line-height: 1.6; margin-bottom: 0.75rem; color: #334155; }
    .word-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    .word-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    .word-content img { max-width: 100%; height: auto; border-radius: 0.5rem; border: 1px solid #e2e8f0; margin: 1rem 0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
    .word-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .word-content th, .word-content td { border: 1px solid #cbd5e1; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    .word-content th { background-color: #f8fafc; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- HEADER NAVIGATION -->
  <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 text-white p-2 rounded-lg">
            <i class="fa-solid fa-book-bookmark text-xl"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-900 leading-tight">Manuales Corporativos</h1>
            <p class="text-xs text-slate-500">Gestión de Proveedores y Procesos Internos</p>
          </div>
        </div>
      </div>
      
      <!-- NAV TABS -->
      <nav class="flex space-x-1 border-t border-slate-100 overflow-x-auto text-sm font-medium py-2">
        <button onclick="setActiveTab('vis-prov')" id="tab-vis-prov" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-building text-blue-600"></i> Vis. Manual Proveedor
        </button>
        <button onclick="setActiveTab('mod-prov')" id="tab-mod-prov" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i> Mod. Manual Proveedor
        </button>
        <button onclick="setActiveTab('vis-int')" id="tab-vis-int" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-file-lines text-purple-600"></i> Vis. Manual Interno
        </button>
        <button onclick="setActiveTab('mod-int')" id="tab-mod-int" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-file-pen text-purple-600"></i> Mod. Manual Interno
        </button>
        <button onclick="setActiveTab('carga')" id="tab-carga" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i> Carga Masiva
        </button>
        <button onclick="setActiveTab('admin')" id="tab-admin" class="tab-btn px-3 py-2 rounded-md flex items-center gap-2 text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-sliders text-slate-600"></i> Administración General
        </button>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="contentView" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6"></div>
  </main>

  <!-- MODAL EDITAR -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-md w-full p-6 mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">Editar Manual</h3>
        <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="editForm" onsubmit="saveEdit(event)">
        <input type="hidden" id="editId">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipo de Manual</label>
          <select id="editCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option value="PROVEEDOR">PROVEEDOR</option>
            <option value="INTERNO">INTERNO</option>
          </select>
        </div>
        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre / Identificador</label>
          <input type="text" id="editName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('editModal')" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-sm font-medium">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const initialManuals = [
      { id: 1, category: 'PROVEEDOR', name: 'MINERA COLQUISIRI S.A.', filename: 'MINERA_COLQUISIRI.docx', date: '2026-01-15', contentHtml: '' },
      { id: 2, category: 'PROVEEDOR', name: 'TECHINT S.A.C.', filename: 'TECHINT_SAC.docx', date: '2026-01-18', contentHtml: '' },
      { id: 3, category: 'PROVEEDOR', name: 'UNION CONCRETERAS S.A.C.', filename: 'UNION_CONCRETERAS.docx', date: '2026-01-20', contentHtml: '' },
      { id: 4, category: 'PROVEEDOR', name: 'ADMINISTRACIÓN DE EMPRESAS S.A.C.', filename: 'ADMINISTRACION_EMPRESAS.docx', date: '2026-02-01', contentHtml: '' },
      { id: 5, category: 'PROVEEDOR', name: 'NEXA RESOURCES S.A.A.', filename: 'NEXA_RESOURCES.docx', date: '2026-02-05', contentHtml: '' },
      { id: 6, category: 'PROVEEDOR', name: 'HOLCIM PERÚ AGREGADOS S.A.C.', filename: 'HOLCIM_PERU.docx', date: '2026-02-10', contentHtml: '' },
      { id: 7, category: 'PROVEEDOR', name: 'FERREYROS S.A.A.', filename: 'FERREYROS_SAA.docx', date: '2026-02-12', contentHtml: '' },
      { id: 8, category: 'INTERNO', name: 'PROCEDIMIENTO DE SOLICITUD DE REQUERIMIENTOS', filename: 'PROC_REQUERIMIENTOS.docx', date: '2026-02-15', contentHtml: '' },
      { id: 9, category: 'INTERNO', name: 'GUÍA OPERATIVA DE GUÍAS INTERNAS DE REMISIÓN', filename: 'GUIA_REMISION.docx', date: '2026-02-20', contentHtml: '' }
    ];

    let manuals = JSON.parse(localStorage.getItem('manuals_db')) || initialManuals;
    let currentTab = 'vis-prov';

    function saveStorage() {
      try {
        localStorage.setItem('manuals_db', JSON.stringify(manuals));
      } catch (e) {
        console.warn('LocalStorage excedido al guardar contenido de imágenes grandes.');
      }
    }

    function setActiveTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-50', 'text-blue-600', 'font-semibold', 'border', 'border-blue-200');
        btn.classList.add('text-slate-600');
      });

      const activeBtn = document.getElementById(`tab-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-blue-50', 'text-blue-600', 'font-semibold', 'border', 'border-blue-200');
        activeBtn.classList.remove('text-slate-600');
      }

      renderView();
    }

    function renderView() {
      const container = document.getElementById('contentView');

      if (currentTab === 'carga') {
        container.innerHTML = getCargaViewHTML();
        initDropzone();
        return;
      }

      let categoryFilter = '';
      let isEditable = false;
      let title = '';
      let subtitle = '';

      switch(currentTab) {
        case 'vis-prov':
          categoryFilter = 'PROVEEDOR';
          isEditable = false;
          title = 'Visualización de Manuales de Proveedores';
          subtitle = 'Consulta del documento oficial completo y paso a paso con imágenes adjuntas.';
          break;
        case 'mod-prov':
          categoryFilter = 'PROVEEDOR';
          isEditable = true;
          title = 'Modificación de Manuales de Proveedores';
          subtitle = 'Edición y eliminación de registros de manuales de proveedores.';
          break;
        case 'vis-int':
          categoryFilter = 'INTERNO';
          isEditable = false;
          title = 'Visualización de Manuales Internos';
          subtitle = 'Consulta del paso a paso completo de manuales e instructivos internos.';
          break;
        case 'mod-int':
          categoryFilter = 'INTERNO';
          isEditable = true;
          title = 'Modificación de Manuales Internos';
          subtitle = 'Gestión y modificación de manuales e instructivos internos.';
          break;
        case 'admin':
          categoryFilter = 'ALL';
          isEditable = true;
          title = 'Directorio Consolidado Completo';
          subtitle = 'Panel general para la administración de todos los manuales registrados.';
          break;
      }

      container.innerHTML = getTableViewHTML(title, subtitle, isEditable);
      filterAndRenderRows(categoryFilter, isEditable);
    }

    function getTableViewHTML(title, subtitle, isEditable) {
      return `
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
          <div>
            <h2 class="text-xl font-bold text-slate-800">${title}</h2>
            <p class="text-sm text-slate-500 mt-1">${subtitle}</p>
          </div>
          ${isEditable ? `
            <button onclick="setActiveTab('carga')" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition">
              <i class="fa-solid fa-plus"></i> Cargar Nuevo Manual
            </button>
          ` : ''}
        </div>

        <div class="my-6">
          <div class="relative w-full max-w-md">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="tableSearch" oninput="handleSearch()" placeholder="Buscar por nombre..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
          </div>
        </div>

        <div class="overflow-x-auto rounded-lg border border-slate-200">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                <th class="py-3 px-4 font-semibold">Tipo</th>
                <th class="py-3 px-4 font-semibold">Nombre / Identificador</th>
                <th class="py-3 px-4 font-semibold">Estado</th>
                <th class="py-3 px-4 font-semibold text-right">Acción</th>
              </tr>
            </thead>
            <tbody id="rowsContainer" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
          <div id="noDataState" class="hidden py-12 text-center text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
            <p class="text-sm">No se encontraron manuales en esta sección.</p>
          </div>
        </div>
      `;
    }

    function filterAndRenderRows(category, isEditable) {
      const query = (document.getElementById('tableSearch')?.value || '').toLowerCase();
      const container = document.getElementById('rowsContainer');
      const noData = document.getElementById('noDataState');
      
      container.innerHTML = '';

      let list = manuals;
      if (category !== 'ALL') {
        list = list.filter(m => m.category === category);
      }

      if (query) {
        list = list.filter(m => m.name.toLowerCase().includes(query));
      }

      if (list.length === 0) {
        noData.classList.remove('hidden');
        return;
      }
      noData.classList.add('hidden');

      list.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
        tr.innerHTML = `
          <td class="py-3 px-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${item.category === 'PROVEEDOR' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
              ${item.category}
            </span>
          </td>
          <td class="py-3 px-4 font-semibold text-slate-800">${item.name}</td>
          <td class="py-3 px-4">
            <span class="inline-flex items-center gap-1.5 text-xs text-emerald-600 font-medium">
              <i class="fa-solid fa-circle-check"></i> Listo para visualizar
            </span>
          </td>
          <td class="py-3 px-4 text-right space-x-1">
            <button onclick="displayFullManual(${item.id})" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-md transition shadow-sm inline-flex items-center gap-1.5">
              <i class="fa-solid fa-book-open"></i> Visualizar Manual
            </button>
            ${isEditable ? `
              <button onclick="openEditModal(${item.id})" title="Editar" class="p-1.5 text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteManual(${item.id})" title="Eliminar" class="p-1.5 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            ` : ''}
          </td>
        `;
        container.appendChild(tr);
      });
    }

    // VISUALIZADOR COMPLETO DEL DOCUMENTO CUALQUIERA SEA SU CONTENIDO CON IMÁGENES
    function displayFullManual(id) {
      const item = manuals.find(m => m.id === id);
      if (!item) return;

      const container = document.getElementById('contentView');
      const filenameDisplay = item.filename || `${item.name}.docx`;

      let docContentHTML = item.contentHtml;

      if (!docContentHTML || docContentHTML.trim() === "") {
        docContentHTML = `
          <div class="p-6 bg-amber-50 border border-amber-200 rounded-xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-2"></i>
            <h3 class="font-bold text-slate-800 text-base mb-1">Manual registrado previamente en lista estática</h3>
            <p class="text-sm text-slate-600 mb-4">Para ver el manual con **todas sus imágenes y pasos al pie de la letra**, por favor vuelve a subir el archivo <strong>.docx</strong> desde la pestaña <strong>Carga Masiva</strong>.</p>
            <button onclick="setActiveTab('carga')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Ir a Carga Masiva</button>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between pb-4 border-b border-slate-200">
            <button onclick="renderView()" class="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition">
              <i class="fa-solid fa-arrow-left"></i> Volver a la lista
            </button>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${item.category === 'PROVEEDOR' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
                ${item.category}
              </span>
              <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition inline-flex items-center gap-1">
                <i class="fa-solid fa-print"></i> Imprimir / PDF
              </button>
            </div>
          </div>

          <div class="bg-slate-50 border border-slate-200 rounded-xl p-6">
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">${item.name}</h1>
            <div class="flex flex-wrap items-center gap-4 text-xs text-slate-500">
              <span><i class="fa-solid fa-file-word text-blue-600 mr-1"></i> Archivo: <strong>${filenameDisplay}</strong></span>
              <span><i class="fa-solid fa-calendar-day mr-1"></i> Registro: ${item.date || '2026-01-01'}</span>
              <span><i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> Documento Verificado</span>
            </div>
          </div>

          <!-- DOCUMENT BODY FULL EXTRACTED FROM WORD -->
          <div class="word-content bg-white p-4 rounded-xl border border-slate-100">
            ${docContentHTML}
          </div>

          <div class="pt-6 border-t border-slate-200 flex justify-between items-center">
            <button onclick="renderView()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">
              <i class="fa-solid fa-arrow-left mr-1"></i> Volver a la lista
            </button>
          </div>
        </div>
      `;
    }

    function handleSearch() {
      const category = currentTab.includes('prov') ? 'PROVEEDOR' : (currentTab.includes('int') ? 'INTERNO' : 'ALL');
      const isEditable = currentTab.startsWith('mod') || currentTab === 'admin';
      filterAndRenderRows(category, isEditable);
    }

    function getCargaViewHTML() {
      return `
        <h2 class="text-xl font-bold text-slate-800 mb-1">Carga Masiva de Manuales Word</h2>
        <p class="text-sm text-slate-500 mb-6">Sube tus archivos Word (.docx). El contenido completo (incluyendo capturas de pantalla, pasos y tablas) se extraerá automáticamente para su visualización.</p>

        <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Destino de los manuales a cargar:</label>
          <div class="flex flex-wrap gap-6 text-sm font-medium">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="uploadType" value="PROVEEDOR" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              <span class="text-slate-800"><i class="fa-solid fa-building text-blue-600 mr-1"></i> Manual de Proveedor</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="uploadType" value="INTERNO" class="w-4 h-4 text-purple-600 focus:ring-purple-500">
              <span class="text-slate-800"><i class="fa-solid fa-file-lines text-purple-600 mr-1"></i> Manual Interno</span>
            </label>
          </div>
        </div>

        <div id="dropzone" class="border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-xl p-10 text-center bg-blue-50/40 hover:bg-blue-50 transition cursor-pointer">
          <div class="flex flex-col items-center">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 mb-3">
              <i class="fa-solid fa-file-word text-3xl"></i>
            </div>
            <p class="text-slate-800 font-semibold mb-1">Haga clic o arrastre aquí sus manuales Word (.docx)</p>
            <p class="text-xs text-slate-400">Extraerá imágenes, pasos y textos del archivo</p>
            <input type="file" id="fileInput" accept=".docx" multiple class="hidden">
          </div>
        </div>
      `;
    }

    function initDropzone() {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');

      if (!dropzone) return;

      dropzone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    }

    // EXTRAE EL TEXTO E IMÁGENES DEL ARCHIVO WORD (DOCX)
    function handleFiles(files) {
      if (files.length === 0) return;
      const selectedCategory = document.querySelector('input[name="uploadType"]:checked').value;

      let processedCount = 0;

      Array.from(files).forEach(file => {
        const cleanName = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
        const reader = new FileReader();

        reader.onload = function(event) {
          const arrayBuffer = event.target.result;
          
          // Opciones de Mammoth para convertir imágenes incrustadas
          const options = {
            convertImage: mammoth.images.imgElement(function(image) {
              return image.read("base64").then(function(imageBuffer) {
                return {
                  src: "data:" + image.contentType + ";base64," + imageBuffer
                };
              });
            })
          };

          mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, options)
            .then(function(result) {
              const htmlContent = result.value;
              
              manuals.unshift({
                id: Date.now() + Math.floor(Math.random() * 1000),
                category: selectedCategory,
                name: cleanName,
                filename: file.name,
                date: new Date().toISOString().split('T')[0],
                contentHtml: htmlContent
              });
              
              processedCount++;
              if (processedCount === files.length) {
                saveStorage();
                alert(`${files.length} manual(es) procesado(s) exitosamente con sus pasos e imágenes.`);
                setActiveTab(selectedCategory === 'PROVEEDOR' ? 'vis-prov' : 'vis-int');
              }
            })
            .catch(function(err) {
              console.error(err);
              processedCount++;
            });
        };

        reader.readAsArrayBuffer(file);
      });
    }

    function openEditModal(id) {
      const item = manuals.find(m => m.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('editCategory').value = item.category;
      document.getElementById('editName').value = item.name;

      openModal('editModal');
    }

    function saveEdit(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById('editId').value);
      const item = manuals.find(m => m.id === id);
      
      if (item) {
        item.category = document.getElementById('editCategory').value;
        item.name = document.getElementById('editName').value;
        saveStorage();
        renderView();
        closeModal('editModal');
      }
    }

    function deleteManual(id) {
      const item = manuals.find(m => m.id === id);
      if (item && confirm(`¿Confirma que desea eliminar el manual "${item.name}"?`)) {
        manuals = manuals.filter(m => m.id !== id);
        saveStorage();
        renderView();
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    document.addEventListener('DOMContentLoaded', () => {
      saveStorage();
      setActiveTab('vis-prov');
    });
  </script>
</body>
</html>
