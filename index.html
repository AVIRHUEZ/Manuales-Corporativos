<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Manuales Corporativos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-blue-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">Centro de Manuales Corporativos</h1>
      <button id="adminBtn" onclick="toggleAdminView()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm px-4 py-2 rounded-lg transition shadow-sm">
        Vista Administrador
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Filtros por tipo -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterType('ALL')" class="filter-btn bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Todos</button>
      <button onclick="filterType('ORGANIGRAMA')" class="filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Organigramas</button>
      <button onclick="filterType('MOF')" class="filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">MOF</button>
      <button onclick="filterType('MAPRO')" class="filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">MAPRO</button>
      <button onclick="filterType('REGLAMENTO')" class="filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Reglamentos</button>
      <button onclick="filterType('OTRO')" class="filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Otros</button>
    </div>

    <!-- Panel Administrador (Oculto por defecto) -->
    <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow-md mb-8 border border-gray-200">
      <h2 class="text-xl font-bold text-gray-900 mb-4" id="formTitle">Agregar Nuevo Manual</h2>
      
      <form id="manualForm" onsubmit="saveManual(event)" class="space-y-4">
        <input type="hidden" id="manualId">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título del Manual</label>
            <input type="text" id="manualTitle" required placeholder="Ej. Manual de Organización y Funciones 2026" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento</label>
            <select id="manualType" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="ORGANIGRAMA">Organigrama</option>
              <option value="MOF">MOF</option>
              <option value="MAPRO">MAPRO</option>
              <option value="REGLAMENTO">Reglamento</option>
              <option value="OTRO">Otro Documento</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Modo de Carga</label>
          <div class="flex gap-4 mb-3">
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="radio" name="uploadMode" value="file" checked onclick="toggleUploadMode()"> Adjuntar Archivo (PDF, Word, Imagen, etc.)
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="radio" name="uploadMode" value="editor" onclick="toggleUploadMode()"> Redactar Texto / HTML
            </label>
          </div>
        </div>

        <div id="fileInputContainer">
          <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Archivo</label>
          <input type="file" id="manualFile" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div id="editorContainer" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">Contenido del Manual</label>
          <textarea id="manualContent" rows="6" placeholder="Escribe o pega aquí el texto o código HTML del manual..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="resetForm()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800">Guardar Documento</button>
        </div>
      </form>
    </div>

    <!-- Lista de Manuales -->
    <div id="manualsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-gray-500">Cargando manuales...</div>
    </div>

  </main>

  <!-- Modal de Visualización -->
  <div id="viewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col">
      <div class="p-4 border-b flex justify-between items-center">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-900"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto flex-1 text-gray-800 leading-relaxed">
        <!-- Contenido dinámico -->
      </div>
      <div class="p-4 border-t flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg text-sm hover:bg-gray-300">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://cufshbjqyoqdtxjyisoi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gok_tEHpZc32_xgeAG-tKQ_qzsGKUdm';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let manuals = [];
    let currentFilter = 'ALL';
    let isAdmin = false;

    // Inicializar
    document.addEventListener('DOMContentLoaded', loadManuals);

    async function loadManuals() {
      try {
        const { data, error } = await supabaseClient.from('manuals').select('*');
        if (error) throw error;
        manuals = data || [];
        renderManuals();
      } catch (err) {
        console.error('Error cargando manuales:', err);
        document.getElementById('manualsList').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Error al cargar los documentos.</div>`;
      }
    }

    function toggleAdminView() {
      isAdmin = !isAdmin;
      const adminPanel = document.getElementById('adminPanel');
      const adminBtn = document.getElementById('adminBtn');
      
      if (isAdmin) {
        adminPanel.classList.remove('hidden');
        adminBtn.innerText = 'Vista Usuario';
        adminBtn.classList.replace('bg-blue-700', 'bg-gray-700');
      } else {
        adminPanel.classList.add('hidden');
        adminBtn.innerText = 'Vista Administrador';
        adminBtn.classList.replace('bg-gray-700', 'bg-blue-700');
      }
      renderManuals();
    }

    function toggleUploadMode() {
      const mode = document.querySelector('input[name="uploadMode"]:checked').value;
      const fileContainer = document.getElementById('fileInputContainer');
      const editorContainer = document.getElementById('editorContainer');

      if (mode === 'file') {
        fileContainer.classList.remove('hidden');
        editorContainer.classList.add('hidden');
      } else {
        fileContainer.classList.add('hidden');
        editorContainer.classList.remove('hidden');
      }
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.innerText.toUpperCase().includes(type) || (type === 'ALL' && btn.innerText === 'Todos')) {
          btn.className = 'filter-btn bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm';
        } else {
          btn.className = 'filter-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm';
        }
      });
      renderManuals();
    }

    function renderManuals() {
      const container = document.getElementById('manualsList');
      const filtered = currentFilter === 'ALL' 
        ? manuals 
        : manuals.filter(m => m.type === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No hay manuales disponibles en esta categoría.</div>`;
        return;
      }

      container.innerHTML = filtered.map(m => `
        <div class="bg-white rounded-xl shadow-md border border-gray-100 p-6 flex flex-col justify-between hover:shadow-lg transition">
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-bold px-2 py-1 rounded bg-blue-50 text-blue-800 uppercase tracking-wide">${m.type}</span>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">${m.title}</h3>
          </div>
          
          <div class="pt-4 border-t border-gray-100 mt-4 flex justify-between items-center">
            ${m.file_data ? `
              <a href="${m.file_data}" download="${m.file_name}" class="text-sm font-medium text-blue-700 hover:text-blue-900 flex items-center gap-1">
                📥 Descargar
              </a>
            ` : `
              <button onclick="viewManual('${m.id}')" class="text-sm font-medium text-blue-700 hover:text-blue-900">
                👁️ Leer en línea
              </button>
            `}

            ${isAdmin ? `
              <div class="flex gap-2">
                <button onclick="editManual('${m.id}')" class="text-xs text-amber-600 hover:underline">Editar</button>
                <button onclick="deleteManual('${m.id}')" class="text-xs text-red-600 hover:underline">Eliminar</button>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function saveManual(event) {
      event.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Guardando...';

      const id = document.getElementById('manualId').value || 'm_' + Date.now();
      const title = document.getElementById('manualTitle').value;
      const type = document.getElementById('manualType').value;
      const mode = document.querySelector('input[name="uploadMode"]:checked').value;

      let html_content = null;
      let file_name = null;
      let file_data = null;

      if (mode === 'editor') {
        html_content = document.getElementById('manualContent').value;
      } else {
        const fileInput = document.getElementById('manualFile');
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          file_name = file.name;
          file_data = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
          });
        } else {
          const existing = manuals.find(m => m.id === id);
          if (existing) {
            file_name = existing.file_name;
            file_data = existing.file_data;
          }
        }
      }

      const payload = { id, title, type, html_content, file_name, file_data };

      try {
        const { error } = await supabaseClient.from('manuals').upsert(payload);
        if (error) throw error;

        await loadManuals();
        resetForm();
      } catch (err) {
        alert('Error al guardar el documento: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Guardar Documento';
      }
    }

    function viewManual(id) {
      const m = manuals.find(item => item.id === id);
      if (!m) return;

      document.getElementById('modalTitle').innerText = m.title;
      document.getElementById('modalBody').innerHTML = m.html_content || '<p class="text-gray-500">Este documento no tiene contenido para lectura directa.</p>';
      document.getElementById('viewModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('viewModal').classList.add('hidden');
    }

    function editManual(id) {
      const m = manuals.find(item => item.id === id);
      if (!m) return;

      document.getElementById('manualId').value = m.id;
      document.getElementById('manualTitle').value = m.title;
      document.getElementById('manualType').value = m.type;

      if (m.html_content) {
        document.querySelectorAll('input[name="uploadMode"]')[1].checked = true;
        document.getElementById('manualContent').value = m.html_content;
      } else {
        document.querySelectorAll('input[name="uploadMode"]')[0].checked = true;
      }
      toggleUploadMode();
      document.getElementById('formTitle').innerText = 'Editar Manual';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteManual(id) {
      if (!confirm('¿Estás seguro de eliminar este manual?')) return;

      try {
        const { error } = await supabaseClient.from('manuals').delete().eq('id', id);
        if (error) throw error;
        await loadManuals();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }

    function resetForm() {
      document.getElementById('manualForm').reset();
      document.getElementById('manualId').value = '';
      document.getElementById('formTitle').innerText = 'Agregar Nuevo Manual';
      toggleUploadMode();
    }
  </script>
</body>
</html>
